server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -----------------------------------------------------------------------
    # 1. Static assets — highest priority, never proxied
    # -----------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # 2. Exact API-only endpoints (no frontend page at these paths)
    # -----------------------------------------------------------------------
    location = /health { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location = /me     { proxy_pass http://api:8000; proxy_set_header Host $host; }

    # -----------------------------------------------------------------------
    # 3. Exact frontend-only SPA pages.
    #    Exact (=) matches beat ^~ prefix blocks, so these are safe even when
    #    a ^~ proxy block covers the same prefix.
    #
    #    /organizer        → organizer dashboard SPA page
    #    /organizer/events → organizer events management SPA page
    #    /organizer/tasks  → organizer task board SPA page
    #    /organizer/notifications → organizer notifications SPA page
    #    /organizer/regs   → organizer registrations SPA page (renamed from
    #                        /organizer/registrations to avoid API conflict)
    #    /organizer/vol-apps → organizer volunteer apps SPA page (renamed from
    #                          /organizer/volunteer-applications to avoid conflict)
    # -----------------------------------------------------------------------
    location = /organizer                  { try_files /index.html =404; }
    location = /organizer/events           { try_files /index.html =404; }
    location = /organizer/tasks            { try_files /index.html =404; }
    location = /organizer/notifications    { try_files /index.html =404; }
    location = /organizer/regs             { try_files /index.html =404; }
    location = /organizer/vol-apps         { try_files /index.html =404; }
    location = /admin                      { try_files /index.html =404; }

    # -----------------------------------------------------------------------
    # 4. API proxy blocks — ^~ prefix blocks win over regex locations.
    #
    #    Route mapping:
    #      /auth/*                    → API
    #      /events (bare)             → API list endpoint
    #                                   (SPA event browser is at /browse)
    #      /registrations/*           → API
    #      /organizer/*               → API (all sub-paths are API endpoints)
    #      /volunteers/*              → API
    #      /volunteer-applications/*  → API
    #      /manage/*                  → API
    #      /certificates/*            → API
    #      /tasks/*                   → API
    #      /notifications/*           → API
    #      /admin/*                   → API
    # -----------------------------------------------------------------------
    location ^~ /auth/                   { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location = /events                   { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location ^~ /registrations/          { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location ^~ /organizer/              { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location ^~ /volunteers/             { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location ^~ /volunteer-applications/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location ^~ /manage/                 { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location ^~ /certificates/           { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location ^~ /tasks/                  { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location ^~ /notifications/          { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location ^~ /admin/                  { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }

    # -----------------------------------------------------------------------
    # 5. Regex locations for /events/* sub-paths.
    #    /events/ is NOT declared with ^~ above so regex locations fire first.
    #
    #    SPA pages (serve index.html on hard refresh):
    #      /events/:id/register   → participant registration page
    #      /events/:id/volunteer  → participant volunteer apply page
    #
    #    All other /events/* paths → API proxy
    # -----------------------------------------------------------------------
    location ~ ^/events/[^/]+/register$  { try_files /index.html =404; }
    location ~ ^/events/[^/]+/volunteer$ { try_files /index.html =404; }
    location ~ ^/events/                 { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }

    # -----------------------------------------------------------------------
    # 6. SPA fallback — all remaining paths serve index.html.
    #    Covers: /, /browse, /login, /signup, /register, /status,
    #            /accept-invite, /event/:id, /volunteer/scanner, /admin,
    #            /organizer/regs, /organizer/vol-apps, and any future routes.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
